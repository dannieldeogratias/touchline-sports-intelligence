[project]
name = "touchline-api"
version = "0.1.0"
description = "Sports intelligence platform API"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.22",
  "alembic>=1.20",
  "asyncpg>=0.32",
  "fastapi>=0.142",
  "pydantic-settings>=2.15",
  "python-multipart>=0.0.22",
  "sqlalchemy[asyncio]>=2.1",
  "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=9.1", "pytest-asyncio>=1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
